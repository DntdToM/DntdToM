<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320">
  <defs>
    <style>
      @keyframes drift1 { 0%{transform:translateY(-300px);opacity:0}8%{opacity:.6}92%{opacity:.6}100%{transform:translateY(340px);opacity:0} }
      @keyframes drift2 { 0%{transform:translateY(-280px);opacity:0}6%{opacity:.5}94%{opacity:.5}100%{transform:translateY(360px);opacity:0} }
      @keyframes drift3 { 0%{transform:translateY(-320px);opacity:0}10%{opacity:.45}90%{opacity:.45}100%{transform:translateY(350px);opacity:0} }
      @keyframes drift4 { 0%{transform:translateY(-260px);opacity:0}12%{opacity:.55}88%{opacity:.55}100%{transform:translateY(330px);opacity:0} }
      @keyframes drift5 { 0%{transform:translateY(-340px);opacity:0}7%{opacity:.4}93%{opacity:.4}100%{transform:translateY(370px);opacity:0} }
      @keyframes scan { 0%{transform:translateY(-20px);opacity:0}10%{opacity:.15}50%{opacity:.15}90%{opacity:.15}100%{transform:translateY(340px);opacity:0} }
      @keyframes blink { 0%,100%{opacity:1}50%{opacity:.15} }
      @keyframes flicker { 0%,100%{opacity:.03}25%{opacity:.06}50%{opacity:.02}75%{opacity:.05} }
      @keyframes pulse { 0%,100%{opacity:.7}50%{opacity:1} }
      @keyframes glitch1 {
        0%,92%,100% { transform:translate(0,0); clip-path:none; }
        93% { transform:translate(-3px,0); clip-path:inset(20% 0 60% 0); }
        94% { transform:translate(3px,0); clip-path:inset(50% 0 20% 0); }
        95% { transform:translate(-2px,1px); clip-path:inset(30% 0 40% 0); }
        96% { transform:translate(0,0); clip-path:none; }
      }
      @keyframes glitch2 {
        0%,88%,100% { transform:translate(0,0); opacity:0; }
        89% { transform:translate(4px,-1px); opacity:.4; }
        90% { transform:translate(-4px,1px); opacity:.3; }
        91% { transform:translate(2px,0); opacity:.2; }
        92% { transform:translate(0,0); opacity:0; }
      }

      .col1{animation:drift1 5.2s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col2{animation:drift2 4.1s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}
      .col3{animation:drift3 6.3s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col4{animation:drift4 3.8s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}
      .col5{animation:drift5 5.7s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col6{animation:drift1 4.5s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}
      .col7{animation:drift3 3.6s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col8{animation:drift2 5.9s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}
      .col9{animation:drift4 4.8s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col10{animation:drift5 3.4s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}
      .col11{animation:drift1 6.1s linear infinite;font-family:'Courier New',monospace;font-size:11px;fill:#8b949e}
      .col12{animation:drift3 4.3s linear infinite;font-family:'Courier New',monospace;font-size:10px;fill:#8b949e}

      .scanbeam{animation:scan 5s ease-in-out infinite}
      .blinker{animation:blink 2s ease-in-out infinite}
      .pulse-text{animation:pulse 3s ease-in-out infinite}

      .title-main{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#f0f6fc;
        animation:glitch1 8s infinite;
      }
      .title-ghost{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#58a6ff;
        animation:glitch2 8s infinite;
        mix-blend-mode:screen;
      }
      .title-ghost2{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#f85149;
        animation:glitch2 8s infinite;
        animation-delay:-0.15s;
        mix-blend-mode:screen;
      }
      .sub-line{
        font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;
        font-size:12px;font-weight:700;letter-spacing:5px;fill:#c9d1d9;
      }
      .bracket-text{
        font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;
        font-size:9.5px;letter-spacing:1.5px;fill:#484f58;
      }
      .lab-title{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;
        font-weight:700;font-size:16px;letter-spacing:0.8px;fill:#f0f6fc;
      }
      .lab-sub{
        font-family:'JetBrains Mono','Fira Code',monospace;
        font-size:10px;letter-spacing:1.5px;fill:#8b949e;
      }
    </style>

    <!-- Radial Vignette (Dark edges, slightly lighter center) -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="70%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85" />
    </radialGradient>

    <!-- Horizontal Fade for dividers -->
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="1" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>

    <!-- Noise/grain texture -->
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" result="ng" />
      <feBlend in="SourceGraphic" in2="ng" mode="multiply" />
    </filter>

    <!-- CRT Scanline Pattern -->
    <pattern id="crt" width="100%" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="920" y2="0" stroke="#000000" stroke-width="1" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="920" height="320" fill="#0d1117" rx="6" />

  <!-- Dense Matrix Code Rain: 12 columns, varied speeds, hex/asm/malware terms -->
  <g opacity="0.22">
    <!-- Column 1 -->
    <g class="col1" transform="translate(32,0)">
      <text y="0">4D</text><text y="14">5A</text><text y="28">90</text><text y="42">00</text>
      <text y="56">03</text><text y="70">00</text><text y="84">04</text><text y="98">FF</text>
      <text y="112">FE</text><text y="126">B8</text><text y="140">00</text><text y="154">40</text>
      <text y="168">0E</text><text y="182">1F</text><text y="196">BA</text><text y="210">CD</text>
      <text y="224">21</text><text y="238">B4</text><text y="252">09</text><text y="266">4C</text>
    </g>
    <!-- Column 2 -->
    <g class="col2" transform="translate(80,0)">
      <text y="0">MZ</text><text y="14">PE</text><text y="28">DLL</text><text y="42">EXE</text>
      <text y="56">SYS</text><text y="70">EIP</text><text y="84">RSP</text><text y="98">RBP</text>
      <text y="112">RAX</text><text y="126">RCX</text><text y="140">XOR</text><text y="154">MOV</text>
      <text y="168">JMP</text><text y="182">NOP</text><text y="196">RET</text><text y="210">INT</text>
      <text y="224">PUSH</text><text y="238">POP</text><text y="252">CALL</text>
    </g>
    <!-- Column 3 -->
    <g class="col3" transform="translate(140,0)">
      <text y="0">CC</text><text y="14">EB</text><text y="28">0F</text><text y="42">05</text>
      <text y="56">90</text><text y="70">C3</text><text y="84">48</text><text y="98">89</text>
      <text y="112">E5</text><text y="126">83</text><text y="140">EC</text><text y="154">20</text>
      <text y="168">8B</text><text y="182">45</text><text y="196">FC</text><text y="210">01</text>
      <text y="224">D0</text><text y="238">C9</text>
    </g>
    <!-- Column 4 -->
    <g class="col4" transform="translate(200,0)">
      <text y="0">YARA</text><text y="14">RULE</text><text y="28">META</text><text y="42">DESC</text>
      <text y="56">HASH</text><text y="70">HIT</text><text y="84">SCAN</text><text y="98">BYTE</text>
      <text y="112">WIDE</text><text y="126">ANY</text><text y="140">ALL</text><text y="154">OF</text>
      <text y="168">THEM</text><text y="182">TRUE</text><text y="196">SECT</text><text y="210">VT</text>
    </g>
    <!-- Column 5 -->
    <g class="col5" transform="translate(270,0)">
      <text y="0">C2</text><text y="14">IOC</text><text y="28">TTP</text><text y="42">APT</text>
      <text y="56">RAT</text><text y="70">BOT</text><text y="84">C&amp;C</text><text y="98">DNS</text>
      <text y="112">TCP</text><text y="126">UDP</text><text y="140">SSL</text><text y="154">TLS</text>
      <text y="168">443</text><text y="182">80</text><text y="196">8080</text><text y="210">4444</text>
      <text y="224">1337</text><text y="238">LOL</text>
    </g>
    <!-- Column 6 -->
    <g class="col6" transform="translate(340,0)">
      <text y="0">48</text><text y="14">8D</text><text y="28">0D</text><text y="42">F7</text>
      <text y="56">FF</text><text y="70">48</text><text y="84">8B</text><text y="98">05</text>
      <text y="112">E8</text><text y="126">00</text><text y="140">48</text><text y="154">C7</text>
      <text y="168">C0</text><text y="182">3C</text><text y="196">0F</text><text y="210">05</text>
      <text y="224">31</text><text y="238">C0</text>
    </g>
    <!-- Column 7 (right of center) -->
    <g class="col7" transform="translate(580,0)">
      <text y="0">VM</text><text y="14">BOX</text><text y="28">SAND</text><text y="42">EVD</text>
      <text y="56">DBG</text><text y="70">BRK</text><text y="84">RDTSC</text><text y="98">CPUID</text>
      <text y="112">INT3</text><text y="126">SIDT</text><text y="140">SLDT</text><text y="154">SGDT</text>
      <text y="168">NtQ</text><text y="182">IsD</text><text y="196">PEB</text><text y="210">TEB</text>
    </g>
    <!-- Column 8 -->
    <g class="col8" transform="translate(650,0)">
      <text y="0">SIGMA</text><text y="14">RULE</text><text y="28">LOGSRC</text><text y="42">EVTID</text>
      <text y="56">PROC</text><text y="70">CREAT</text><text y="84">SUSP</text><text y="98">DETECT</text>
      <text y="112">FILE</text><text y="126">WRITE</text><text y="140">REG</text><text y="154">KEY</text>
      <text y="168">MUTEX</text><text y="182">PIPE</text><text y="196">DRV</text><text y="210">SVC</text>
    </g>
    <!-- Column 9 -->
    <g class="col9" transform="translate(730,0)">
      <text y="0">0F</text><text y="14">B6</text><text y="28">C0</text><text y="42">85</text>
      <text y="56">C0</text><text y="70">74</text><text y="84">0A</text><text y="98">EB</text>
      <text y="112">05</text><text y="126">B8</text><text y="140">01</text><text y="154">00</text>
      <text y="168">5D</text><text y="182">C3</text><text y="196">CC</text><text y="210">90</text>
      <text y="224">F4</text><text y="238">FA</text><text y="252">FB</text>
    </g>
    <!-- Column 10 -->
    <g class="col10" transform="translate(790,0)">
      <text y="0">GHID</text><text y="14">IDA</text><text y="28">x64d</text><text y="42">r2</text>
      <text y="56">GDB</text><text y="70">OllyD</text><text y="84">WinD</text><text y="98">API</text>
      <text y="112">HOOK</text><text y="126">IAT</text><text y="140">EAT</text><text y="154">VA</text>
      <text y="168">RVA</text><text y="182">EP</text><text y="196">TLS</text><text y="210">SEH</text>
    </g>
    <!-- Column 11 -->
    <g class="col11" transform="translate(845,0)">
      <text y="0">DE</text><text y="14">AD</text><text y="28">BE</text><text y="42">EF</text>
      <text y="56">CA</text><text y="70">FE</text><text y="84">BA</text><text y="98">BE</text>
      <text y="112">F0</text><text y="126">0D</text><text y="140">D0</text><text y="154">0D</text>
      <text y="168">13</text><text y="182">37</text><text y="196">00</text><text y="210">FF</text>
    </g>
    <!-- Column 12 -->
    <g class="col12" transform="translate(890,0)">
      <text y="0">PE</text><text y="14">ELF</text><text y="28">MZ</text><text y="42">PK</text>
      <text y="56">7F</text><text y="70">45</text><text y="84">4C</text><text y="98">46</text>
      <text y="112">CA</text><text y="126">FE</text><text y="140">CE</text><text y="154">FA</text>
    </g>
  </g>

  <!-- Static dense hex scatter (background texture, non-animated) -->
  <g font-family="'Courier New',monospace" font-size="9.5px" fill="#30363d" opacity="0.5" letter-spacing="18px" text-anchor="middle">
    <text x="460" y="95">F 7 C 0 A 9 1 E 3 D 8 B 2 F 5 6 4 A C 7 0 E 9</text>
    <text x="460" y="113">4 D 5 A 9 0 0 0 F F F E 0 3 0 0 0 4 0 0 B 8 0</text>
    <text x="460" y="131">M Z P E X O R A N D S H R R O R S H L N O T C</text>
    <text x="460" y="149">0 1 C 3 4 8 8 9 E 5 4 8 8 B 4 5 F C 0 1 D 0 9</text>
    <text x="460" y="203">S I G M A Y A R A R U L E S C A N D E T E C T</text>
    <text x="460" y="221">E 8 0 0 5 D 4 8 C 7 C 0 3 C 0 F 0 5 3 1 C 0 R</text>
    <text x="460" y="239">V O L A T I L I T Y M E M F O R E N S I C S 0</text>
    <text x="460" y="257">0 F B 6 C 0 8 5 C 0 7 4 0 A E B 0 5 B 8 0 1 F</text>
  </g>

  <!-- Vignette overlay (darkens edges for depth) -->
  <rect width="920" height="320" fill="url(#vignette)" />

  <!-- Scan beam -->
  <g class="scanbeam">
    <rect x="0" y="0" width="920" height="1" fill="#ffffff" opacity="0.12" />
    <rect x="60" y="1" width="800" height="2" fill="#ffffff" opacity="0.04" />
  </g>

  <!-- Top Lab Branding -->
  <g transform="translate(460, 42)" text-anchor="middle">
    <!-- Minimal Flask/Beaker Icon -->
    <g transform="translate(-14, -22)" stroke="#c9d1d9" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
      <path d="M9 3h10M12 3v5l-6 11a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3l-6-11V3" />
      <line x1="8.5" y1="15" x2="19.5" y2="15" stroke-dasharray="2 2" stroke-width="1" />
    </g>
    <text x="22" y="-8" class="lab-title" text-anchor="start">DntdToM Lab</text>
    <text x="22" y="7" class="lab-sub" text-anchor="start">Security Research &amp; Threat Detection</text>
  </g>

  <!-- Top Divider -->
  <line x1="80" y1="62" x2="840" y2="62" stroke="url(#lineFade)" stroke-width="0.8" />

  <!-- Corner HUD Brackets -->
  <!-- Top Left -->
  <g transform="translate(36, 82)">
    <path d="M 0 12 L 0 0 L 12 0" fill="none" stroke="#30363d" stroke-width="1.2" />
    <text x="18" y="8" class="bracket-text">NODE: CORE_ANALYSIS // ID: 0x4D5A</text>
  </g>
  <!-- Top Right -->
  <g transform="translate(884, 82)">
    <path d="M 0 0 L 12 0 L 12 12" fill="none" stroke="#30363d" stroke-width="1.2" />
    <text x="-4" y="8" class="bracket-text" text-anchor="end">THREAT_VECTOR: REVERSE_ENGINEERING</text>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(36, 270)">
    <path d="M 0 -12 L 0 0 L 12 0" fill="none" stroke="#30363d" stroke-width="1.2" />
    <text x="18" y="-2" class="bracket-text">PIPELINE: YARA_SIGMA_ACTIVE</text>
    <circle cx="4" cy="-18" r="2.5" fill="#484f58" class="blinker" />
  </g>
  <!-- Bottom Right -->
  <g transform="translate(884, 270)">
    <path d="M 0 0 L 12 0 L 12 -12" fill="none" stroke="#30363d" stroke-width="1.2" />
    <text x="-4" y="-2" class="bracket-text" text-anchor="end">STATUS: ARMED // DEFENSE_ACTIVE</text>
    <circle cx="8" cy="-18" r="2.5" fill="#484f58" class="blinker" />
  </g>

  <!-- MAIN TITLE: DNTDTOM with RGB Glitch Effect -->
  <text x="460" y="174" text-anchor="middle" class="title-ghost2">DNTDTOM</text>
  <text x="460" y="174" text-anchor="middle" class="title-ghost">DNTDTOM</text>
  <text x="460" y="174" text-anchor="middle" class="title-main">DNTDTOM</text>

  <!-- Subtitle Line 1 -->
  <text x="460" y="198" text-anchor="middle" class="sub-line">INFORMATION SECURITY // MALWARE &amp; THREAT DETECTION</text>

  <!-- Subtitle Line 2 (Smaller, dimmer) -->
  <text x="460" y="218" text-anchor="middle" class="bracket-text" letter-spacing="2.5px" fill="#8b949e">[ BINARY_DISSECTION // PAYLOAD_ANALYSIS // DETECTION_ENGINEERING ]</text>

  <!-- Bottom Description Line -->
  <text x="460" y="248" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="9px" fill="#484f58" letter-spacing="1px" class="pulse-text">
    Reversing binaries. Hunting threats. Building defenses.
  </text>

  <!-- Bottom Divider -->
  <line x1="200" y1="292" x2="720" y2="292" stroke="url(#lineFade)" stroke-width="0.6" />

  <!-- CRT Scanline Overlay -->
  <rect width="920" height="320" fill="url(#crt)" rx="6" pointer-events="none" />

  <!-- Outer Frame (subtle) -->
  <rect x="0.5" y="0.5" width="919" height="319" rx="6" fill="none" stroke="#21262d" stroke-width="1" />
</svg>
