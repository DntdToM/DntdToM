<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="320">
  <defs>
    <style>
      @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
      @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes scan{0%{transform:translateY(-20px);opacity:0}10%{opacity:.12}90%{opacity:.12}100%{transform:translateY(340px);opacity:0}}
      @keyframes glitch1{
        0%,92%,100%{transform:translate(0,0)}
        93%{transform:translate(-3px,0)}94%{transform:translate(3px,0)}
        95%{transform:translate(-2px,1px)}96%{transform:translate(0,0)}
      }
      @keyframes glitch2{
        0%,88%,100%{transform:translate(0,0);opacity:0}
        89%{transform:translate(4px,-1px);opacity:.35}
        90%{transform:translate(-4px,1px);opacity:.25}
        91%{transform:translate(2px,0);opacity:.15}92%{opacity:0}
      }

      .title-main{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#f0f6fc;
        animation:glitch1 8s infinite;
      }
      .title-cyan{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#58a6ff;opacity:0;
        animation:glitch2 8s infinite;mix-blend-mode:screen;
      }
      .title-red{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Helvetica Neue',sans-serif;
        font-weight:900;font-size:56px;letter-spacing:14px;fill:#f85149;opacity:0;
        animation:glitch2 8s infinite;animation-delay:-.15s;mix-blend-mode:screen;
      }
      .sub1{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:5px;fill:#c9d1d9}
      .sub2{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;font-size:9.5px;letter-spacing:2px;fill:#8b949e}
      .hud{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;font-size:9.5px;letter-spacing:1.2px;fill:#484f58}
      .lab-t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;font-weight:700;font-size:16px;letter-spacing:.8px;fill:#f0f6fc}
      .lab-s{font-family:'JetBrains Mono','Fira Code',monospace;font-size:10px;letter-spacing:1.5px;fill:#8b949e}
      .hex{font-family:'Courier New',monospace;font-size:10px;letter-spacing:16px;text-anchor:middle}
      .tagline{font-family:'JetBrains Mono','Fira Code',monospace;font-size:9px;fill:#484f58;letter-spacing:1px;animation:pulse 3s ease-in-out infinite}
      .blinker{animation:blink 2s ease-in-out infinite}
      .scanbeam{animation:scan 5s ease-in-out infinite}
    </style>
    <linearGradient id="lf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#30363d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#30363d" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="75%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </radialGradient>
    <pattern id="crt" width="100%" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="920" y2="0" stroke="#000" stroke-width="1" opacity=".1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="920" height="320" fill="#0d1117" rx="6"/>

  <!-- ====== DENSE STATIC HEX MATRIX (5 opacity layers for depth) ====== -->

  <!-- Layer 1: Deepest / faintest (far background) -->
  <g class="hex" fill="#21262d" opacity="0.5">
    <text x="460" y="16">4 D 5 A 9 0 0 0 F F F E 0 3 0 0 0 4 0 0 B 8 0 0 4 0</text>
    <text x="460" y="32">0 E 1 F B A 0 E 0 0 B 4 0 9 C D 2 1 B 8 0 1 4 C C D</text>
    <text x="460" y="48">5 4 6 8 6 9 7 3 2 0 7 0 7 2 6 F 6 7 7 2 6 1 6 D 2 0</text>
    <text x="460" y="272">4 8 8 D 0 D F 7 F F F F 4 8 8 B 0 5 E 8 0 0 0 0 0 0</text>
    <text x="460" y="288">3 1 C 0 4 8 C 7 C 0 3 C 0 F 0 5 5 D C 3 F 4 F A F B</text>
    <text x="460" y="304">D E A D B E E F C A F E B A B E F 0 0 D D 0 0 D 1 3</text>
  </g>

  <!-- Layer 2: Slightly visible -->
  <g class="hex" fill="#30363d" opacity="0.55">
    <text x="460" y="64">C C E B 0 F 0 5 9 0 C 3 4 8 8 9 E 5 8 3 E C 2 0 8 B</text>
    <text x="460" y="80">4 5 F C 0 1 D 0 C 9 C 3 5 5 8 9 E 5 4 8 8 3 E C 2 8</text>
    <text x="460" y="256">0 F B 6 C 0 8 5 C 0 7 4 0 A E B 0 5 B 8 0 1 0 0 0 0</text>
  </g>

  <!-- Layer 3: Main visible field (surrounds title) -->
  <g class="hex" fill="#484f58" opacity="0.5">
    <text x="460" y="100">M Z P E N O P X O R J M P C A L L R E T P U S H M O V</text>
    <text x="460" y="118">Y A R A R U L E S I G M A D E T E C T S C A N H I T</text>
    <text x="460" y="136">A P I H O O K I A T E A T V A R V A E P T L S S E H</text>
    <text x="460" y="208">S A N D B O X V M E V A D E R D T S C C P U I D I N T</text>
    <text x="460" y="226">V O L A T I L I T Y M E M D U M P F O R E N S I C S</text>
    <text x="460" y="244">G H I D R A I D A P R O x 6 4 d b g R A D A R E 2 0</text>
  </g>

  <!-- Layer 4: Brighter accents (near title area) -->
  <g class="hex" fill="#8b949e" opacity="0.2">
    <text x="460" y="148">R A X R C X R D X R S I R D I R 8 R 9 R 1 0 R B P 0</text>
    <text x="460" y="196">C 2 I O C T T P A P T R A T B O T C & C D N S T C P 0</text>
  </g>

  <!-- Vignette (darkens edges, creates spotlight on center) -->
  <rect width="920" height="320" fill="url(#vig)"/>

  <!-- Scan Beam (animated) -->
  <g class="scanbeam">
    <rect x="0" y="0" width="920" height="1" fill="#fff" opacity=".1"/>
    <rect x="60" y="1" width="800" height="2" fill="#fff" opacity=".03"/>
  </g>

  <!-- ====== TOP LAB BRANDING ====== -->
  <g transform="translate(460,42)" text-anchor="middle">
    <g transform="translate(-14,-22)" stroke="#c9d1d9" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".75">
      <path d="M9 3h10M12 3v5l-6 11a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3l-6-11V3"/>
      <line x1="8.5" y1="15" x2="19.5" y2="15" stroke-dasharray="2 2" stroke-width="1"/>
    </g>
    <text x="22" y="-8" class="lab-t" text-anchor="start">DntdToM Lab</text>
    <text x="22" y="7" class="lab-s" text-anchor="start">Security Research &amp; Threat Detection</text>
  </g>

  <!-- Top Divider -->
  <line x1="80" y1="62" x2="840" y2="62" stroke="url(#lf)" stroke-width=".7"/>

  <!-- ====== HUD CORNER BRACKETS ====== -->
  <!-- TL -->
  <g transform="translate(36,82)">
    <path d="M 0 14 L 0 0 L 14 0" fill="none" stroke="#30363d" stroke-width="1.3"/>
    <text x="20" y="8" class="hud">NODE: CORE_ANALYSIS // ID: 0x4D5A</text>
  </g>
  <!-- TR -->
  <g transform="translate(884,82)">
    <path d="M -2 0 L 12 0 L 12 14" fill="none" stroke="#30363d" stroke-width="1.3"/>
    <text x="-6" y="8" class="hud" text-anchor="end">THREAT_VECTOR: REVERSE_ENGINEERING</text>
  </g>
  <!-- BL -->
  <g transform="translate(36,270)">
    <path d="M 0 -14 L 0 0 L 14 0" fill="none" stroke="#30363d" stroke-width="1.3"/>
    <text x="20" y="-4" class="hud">PIPELINE: YARA_SIGMA_ACTIVE</text>
    <circle cx="6" cy="-20" r="2.5" fill="#484f58" class="blinker"/>
  </g>
  <!-- BR -->
  <g transform="translate(884,270)">
    <path d="M -2 0 L 12 0 L 12 -14" fill="none" stroke="#30363d" stroke-width="1.3"/>
    <text x="-6" y="-4" class="hud" text-anchor="end">STATUS: ARMED // DEFENSE_ACTIVE</text>
    <circle cx="6" cy="-20" r="2.5" fill="#484f58" class="blinker"/>
  </g>

  <!-- ====== MAIN TITLE (Glitch layers) ====== -->
  <text x="460" y="174" text-anchor="middle" class="title-red">DNTDTOM</text>
  <text x="460" y="174" text-anchor="middle" class="title-cyan">DNTDTOM</text>
  <text x="460" y="174" text-anchor="middle" class="title-main">DNTDTOM</text>

  <!-- Subtitle -->
  <text x="460" y="198" text-anchor="middle" class="sub1">INFORMATION SECURITY // MALWARE &amp; THREAT DETECTION</text>
  <text x="460" y="218" text-anchor="middle" class="sub2">[ BINARY_DISSECTION // PAYLOAD_ANALYSIS // DETECTION_ENGINEERING ]</text>

  <!-- Tagline -->
  <text x="460" y="248" text-anchor="middle" class="tagline">Reversing binaries. Hunting threats. Building defenses.</text>

  <!-- Bottom Divider -->
  <line x1="200" y1="292" x2="720" y2="292" stroke="url(#lf)" stroke-width=".5"/>

  <!-- CRT Scanlines -->
  <rect width="920" height="320" fill="url(#crt)" rx="6" pointer-events="none"/>

  <!-- Outer Frame -->
  <rect x=".5" y=".5" width="919" height="319" rx="6" fill="none" stroke="#21262d" stroke-width="1"/>
</svg>
