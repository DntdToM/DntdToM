<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="340">
  <defs>
    <style>
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.75; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        50% { opacity: 0.25; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      .mono-faded {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 11px;
        fill: #484f58;
        letter-spacing: 14px;
        user-select: none;
      }
      .hud-bracket {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        fill: #8b949e;
        letter-spacing: 1.5px;
      }
      .main-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: 12px;
        fill: #ffffff;
      }
      .sub-title {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #c9d1d9;
      }
      .sub-bracket {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
        font-size: 10px;
        letter-spacing: 2px;
        fill: #8b949e;
      }
      .top-lab-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: 1px;
        fill: #f0f6fc;
      }
      .top-lab-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10.5px;
        letter-spacing: 1.5px;
        fill: #8b949e;
      }
      .scan-line {
        animation: scanBeam 6s ease-in-out infinite;
      }
    </style>

    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363d" stop-opacity="0" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="1" />
      <stop offset="100%" stop-color="#30363d" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Canvas Background (Seamless with GitHub Dark #0d1117) -->
  <rect width="920" height="340" fill="#0d1117" rx="10" />
  <rect width="918" height="338" x="1" y="1" fill="none" stroke="#21262d" stroke-width="1" rx="9" />

  <!-- Scanning Beam Effect -->
  <line class="scan-line" x1="40" y1="0" x2="880" y2="0" stroke="#ffffff" stroke-width="0.75" />

  <!-- Top Lab Branding (Ref: Minimal Beaker/Shield & Text) -->
  <g transform="translate(460, 48)" text-anchor="middle">
    <!-- Minimal Monochromatic Terminal / Flask Icon -->
    <g transform="translate(-14, -28)" stroke="#f0f6fc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 3h10M12 3v5l-6 11a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3l-6-11V3" />
      <line x1="8.5" y1="15" x2="19.5" y2="15" stroke-dasharray="2 2" stroke-width="1.2" />
    </g>
    <text x="22" y="-14" class="top-lab-title" text-anchor="start">DntdToM Lab</text>
    <text x="22" y="2" class="top-lab-sub" text-anchor="start">Security Research &amp; Threat Detection</text>
  </g>

  <!-- Divider Line -->
  <line x1="100" y1="78" x2="820" y2="78" stroke="url(#lineFade)" stroke-width="1" />

  <!-- ASCII / Hex Scatter Matrix Background (Exact reference look) -->
  <g opacity="0.4" text-anchor="middle">
    <text x="460" y="112" class="mono-faded">A 0 C 7 8 9 F 1 D 0 4 D 5 A 9 0</text>
    <text x="460" y="132" class="mono-faded">M Z P E 3 2 X O R R A X R S P E I P</text>
    <text x="460" y="152" class="mono-faded">0 1 Y A R A S I G M A 0 F 0 5 C C</text>
    <text x="460" y="172" class="mono-faded">E L F V M B O X D U M P I O C C 2</text>
    <text x="460" y="192" class="mono-faded">S Y S C A L L W O R M 7 B 9 F 1 D</text>
    <text x="460" y="212" class="mono-faded">N O P H O O K D L L I N J E C T</text>
    <text x="460" y="232" class="mono-faded">0 x 4 D 5 A 0 x 9 0 0 x C C 0 x E B</text>
    <text x="460" y="252" class="mono-faded">R B P R 1 2 R 1 3 R 1 4 R 1 5 J M P</text>
  </g>

  <!-- HUD Telemetry Brackets (4 corners) -->
  <!-- Top Left -->
  <text x="48" y="115" class="hud-bracket">[ NODE: LAB_CORE // ID: 0x4D5A_MZ ]</text>
  <!-- Top Right -->
  <text x="872" y="115" class="hud-bracket" text-anchor="end">[ THREAT_VECTOR: REVERSE_ENGINEERING ]</text>
  <!-- Bottom Left -->
  <text x="48" y="280" class="hud-bracket">[ RULES: YARA_SIGMA_SYNCHRONIZED ]</text>
  <!-- Bottom Right -->
  <text x="872" y="280" class="hud-bracket" text-anchor="end">[ TELEMETRY: ACTIVE // DEFENSE_LEVEL: 0 ]</text>

  <!-- Center Big Bold Title: DNTDTOM -->
  <text x="466" y="185" text-anchor="middle" class="main-title">DNTDTOM</text>

  <!-- Subtitle Line 1 -->
  <text x="460" y="218" text-anchor="middle" class="sub-title">INFORMATION SECURITY // MALWARE &amp; THREAT DETECTION</text>

  <!-- Subtitle Line 2 (Telemetry brackets) -->
  <text x="460" y="244" text-anchor="middle" class="sub-bracket">[ BINARY_DISSECTION // PAYLOAD_ANALYSIS // DETECTION_ENGINEERING ]</text>

  <!-- Bottom Divider Line -->
  <line x1="160" y1="304" x2="760" y2="304" stroke="url(#lineFade)" stroke-width="1" />
</svg>
