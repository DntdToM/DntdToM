    <text x="-6" y="-4" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="9.5" letter-spacing="1.2" fill="#484f58" text-anchor="end">STATUS: ARMED // DEFENSE_ACTIVE</text>
